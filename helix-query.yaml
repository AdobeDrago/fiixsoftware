indices:
  blog:
    include:
      - /blog/**
    exclude:
      - /blog
    target: /query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, "content")
      category:
        select: head > meta[name="category"]
        value: attribute(el, "content")
      date:
        select: head > meta[name="publication-date"]
        value: attribute(el, "content")
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, "content")
  case-studies:
    include:
      - /resource-center/case-studies/**
    exclude:
      - /resource-center/case-studies
      # category / industry archive pages (not articles)
      - /resource-center/case-studies/analytics
      - /resource-center/case-studies/asset-management
      - /resource-center/case-studies/cmms-implementation
      - /resource-center/case-studies/condition-based-maintenance
      - /resource-center/case-studies/integrations
      - /resource-center/case-studies/parts-management
      - /resource-center/case-studies/predictive-maintenance
      - /resource-center/case-studies/roi
      - /resource-center/case-studies/sustainability
      - /resource-center/case-studies/work-order-management
      - /resource-center/case-studies/agriculture
      - /resource-center/case-studies/construction
      - /resource-center/case-studies/discrete-manufacturing
      - /resource-center/case-studies/facilities-management
      - /resource-center/case-studies/fleet-management
      - /resource-center/case-studies/mining
      - /resource-center/case-studies/oil-and-gas
      - /resource-center/case-studies/process-manufacturing
      - /resource-center/case-studies/renewable-energy
      - /resource-center/case-studies/wholesale-distribution
    target: /case-studies-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      image:
        select: head > meta[name="image"]
        value: attribute(el, "content")
      cardTitle:
        select: head > meta[name="cardtitle"]
        value: attribute(el, "content")
      category:
        select: head > meta[name="category"]
        value: attribute(el, "content")
      industry:
        select: head > meta[name="industry"]
        value: attribute(el, "content")
