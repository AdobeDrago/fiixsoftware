<div class="blog-listing-toolbar">
  <label class="blog-listing-search">
    <span class="blog-listing-label">Search</span>
    <input type="search" name="q" placeholder="Search blogs" autocomplete="off">
  </label>
  <label class="blog-listing-category">
    <span class="blog-listing-label">Category</span>
    <select name="category">
      <option value="">All categories</option>
    </select>
  </label>
</div>
<ul class="blog-listing-results"></ul>
<p class="blog-listing-empty" hidden>No posts match your filters.</p>
